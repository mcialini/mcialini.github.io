<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Apps</title>
    <meta name="description" content="My collection of web apps.">
    <!-- Browser chrome color on mobile -->
    <meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
    <!-- NOT a PWA: no manifest, no service worker -->
    <link rel="stylesheet" href="/shared/styles.css">
    <style>
        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: calc(var(--space-xl) + var(--safe-top)) var(--space-lg) var(--space-md);
        }

        header h1 {
            font-size: var(--font-size-xl);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--color-text-muted);
            font-size: var(--font-size-sm);
            margin-top: var(--space-xs);
        }

        main {
            flex: 1;
            padding: var(--space-md) var(--space-lg);
            padding-bottom: calc(var(--space-xl) + var(--safe-bottom));
        }

        .section-label {
            font-size: var(--font-size-sm);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--color-text-muted);
            margin-bottom: var(--space-sm);
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: var(--space-md);
        }

        .app-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-lg) var(--space-md);
            background: var(--color-surface);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            text-decoration: none;
            color: var(--color-text);
            border: 1px solid var(--color-border);
            transition: transform 0.1s, box-shadow 0.1s;
            /* Minimum tap target */
            min-height: 100px;
        }

        .app-card:active {
            transform: scale(0.97);
            box-shadow: none;
        }

        .app-card-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            /* Each app overrides --app-color and --app-icon in its card style */
            background: var(--app-color, var(--color-primary));
        }

        .app-card-name {
            font-size: var(--font-size-sm);
            font-weight: 500;
            text-align: center;
        }

        /* Empty state shown when no apps are defined */
        .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--color-text-muted);
            padding: var(--space-xl) 0;
            font-size: var(--font-size-sm);
        }
    </style>
</head>

<body>
    <header>
        <h1>My Apps</h1>
        <p>Tap an app to open it. Install from within each app.</p>
    </header>

    <main>
        <p class="section-label">Apps</p>
        <div class="app-grid">

            <!-- ============================================================
           Add an <a class="app-card"> entry here for each new sub-app.
           Pattern:
             href  →  /{app-name}/
             --app-color  →  any CSS color for the icon background
             emoji or <img>  →  icon content
           ============================================================ -->

            <a class="app-card" href="/template/" style="--app-color: #1a73e8;">
                <div class="app-card-icon">📝</div>
                <span class="app-card-name">Template</span>
            </a>

            <!-- Add more app cards above this line -->

        </div>
    </main>
</body>

</html>
