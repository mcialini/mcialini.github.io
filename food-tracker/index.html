<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Food Tracker</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/food-tracker/manifest.webmanifest">

    <!-- Browser chrome / status bar color -->
    <meta name="theme-color" content="#e8601a">

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Food">
    <link rel="apple-touch-icon" href="/food-tracker/icons/icon-180.png">

    <link rel="stylesheet" href="/shared/styles.css">
    <style>
        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ---- Feed ---- */
        .feed {
            flex: 1;
            padding: var(--space-md);
            padding-bottom: calc(80px + var(--safe-bottom) + var(--space-lg));
            max-width: 640px;
            margin: 0 auto;
            width: 100%;
        }

        .day-group {
            margin-bottom: var(--space-lg);
        }

        .day-label {
            font-size: var(--font-size-sm);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--color-text-muted);
            margin-bottom: var(--space-sm);
            position: sticky;
            top: calc(53px + var(--safe-top));
            background: var(--color-bg);
            padding: var(--space-xs) 0;
            z-index: 5;
        }

        .entry-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            margin-bottom: var(--space-sm);
            position: relative;
        }

        .entry-name {
            font-weight: 600;
            font-size: var(--font-size-base);
        }

        .entry-meta {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-top: var(--space-xs);
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
        }

        .entry-source {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 8px;
            border-radius: 99px;
            background: color-mix(in srgb, var(--color-primary) 12%, transparent);
            color: var(--color-primary);
            font-size: 12px;
            font-weight: 500;
        }

        .entry-notes {
            margin-top: var(--space-sm);
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
            font-style: italic;
        }

        .entry-recipe {
            margin-top: var(--space-sm);
        }

        .entry-recipe a {
            font-size: var(--font-size-sm);
            color: var(--color-primary);
            text-decoration: none;
        }

        .entry-recipe a:hover {
            text-decoration: underline;
        }

        .entry-delete {
            position: absolute;
            top: var(--space-sm);
            right: var(--space-sm);
            background: none;
            border: none;
            color: var(--color-text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .entry-delete:hover {
            color: #e53935;
            background: rgba(229, 57, 53, 0.08);
        }

        /* ---- Empty State ---- */
        .empty-state {
            text-align: center;
            color: var(--color-text-muted);
            padding: var(--space-xl) 0;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: var(--space-md);
        }

        /* ---- FAB ---- */
        .fab {
            position: fixed;
            bottom: calc(var(--space-lg) + var(--safe-bottom));
            right: var(--space-lg);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--color-primary);
            color: var(--color-primary-fg);
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s;
        }

        .fab:active {
            transform: scale(0.9);
        }

        /* ---- Bottom Sheet Overlay ---- */
        .sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .sheet-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        /* ---- Bottom Sheet ---- */
        .sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--color-surface);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            padding: var(--space-md) var(--space-lg);
            padding-bottom: calc(var(--space-lg) + var(--safe-bottom));
            z-index: 51;
            transform: translateY(100%);
            transition: transform 0.25s ease-out;
            max-height: 85dvh;
            overflow-y: auto;
        }

        .sheet.open {
            transform: translateY(0);
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            background: var(--color-border);
            border-radius: 2px;
            margin: 0 auto var(--space-md);
        }

        .sheet h2 {
            font-size: var(--font-size-lg);
            font-weight: 600;
            margin-bottom: var(--space-md);
        }

        /* ---- Form ---- */
        .form-group {
            margin-bottom: var(--space-md);
        }

        .form-group label {
            display: block;
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--color-text-muted);
            margin-bottom: var(--space-xs);
        }

        .form-group input[type="text"],
        .form-group input[type="url"],
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-family: var(--font-sans);
            font-size: var(--font-size-base);
            background: var(--color-bg);
            color: var(--color-text);
            outline: none;
            transition: border-color 0.15s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--color-primary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        /* ---- Radio Group ---- */
        .radio-group {
            display: flex;
            gap: var(--space-sm);
        }

        .radio-group label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 8px 4px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: var(--font-size-sm);
            font-weight: 500;
            color: var(--color-text);
            transition: background 0.1s, border-color 0.1s;
            text-align: center;
            min-height: 44px;
        }

        .radio-group input {
            display: none;
        }

        .radio-group input:checked+label {
            background: color-mix(in srgb, var(--color-primary) 12%, transparent);
            border-color: var(--color-primary);
            color: var(--color-primary);
        }

        /* ---- Autocomplete ---- */
        .autocomplete-wrapper {
            position: relative;
        }

        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-top: none;
            border-radius: 0 0 var(--radius-sm) var(--radius-sm);
            max-height: 180px;
            overflow-y: auto;
            z-index: 60;
            display: none;
        }

        .autocomplete-list.visible {
            display: block;
        }

        .autocomplete-item {
            padding: 10px 12px;
            font-size: var(--font-size-base);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .autocomplete-item:hover,
        .autocomplete-item.active {
            background: color-mix(in srgb, var(--color-primary) 8%, transparent);
        }

        .autocomplete-item .freq {
            font-size: var(--font-size-sm);
            color: var(--color-text-muted);
        }

        .submit-btn {
            width: 100%;
            margin-top: var(--space-sm);
        }
    </style>
</head>

<body>

    <!-- iOS install banner -->
    <install-banner app-name="Food Tracker"></install-banner>

    <header class="app-header">
        <a href="/" class="back-btn" aria-label="Go to home">&#8592;</a>
        <h1>Food Tracker</h1>
        <button id="install-btn" class="btn btn-primary" hidden aria-label="Install app">
            Install
        </button>
    </header>

    <div class="feed" id="feed">
        <div class="empty-state" id="empty-state">
            <div class="icon">🍽️</div>
            <p>No entries yet. Tap + to add your first meal.</p>
        </div>
    </div>

    <!-- FAB -->
    <button class="fab" id="fab-btn" aria-label="Add food entry">+</button>

    <!-- Bottom Sheet Overlay -->
    <div class="sheet-overlay" id="sheet-overlay"></div>

    <!-- Bottom Sheet -->
    <div class="sheet" id="sheet">
        <div class="sheet-handle"></div>
        <h2>Add Entry</h2>
        <form id="entry-form" autocomplete="off">

            <div class="form-group">
                <label for="food-name">What did you eat?</label>
                <div class="autocomplete-wrapper">
                    <input type="text" id="food-name" name="name" required placeholder="e.g. Chicken stir fry"
                        enterkeyhint="done">
                    <div class="autocomplete-list" id="autocomplete-list"></div>
                </div>
            </div>

            <div class="form-group">
                <label>Source</label>
                <div class="radio-group">
                    <input type="radio" name="source" id="src-cooked" value="cooked" checked>
                    <label for="src-cooked">🍳 Cooked</label>
                    <input type="radio" name="source" id="src-premade" value="premade">
                    <label for="src-premade">📦 Premade</label>
                    <input type="radio" name="source" id="src-takeout" value="takeout">
                    <label for="src-takeout">🥡 Takeout</label>
                </div>
            </div>

            <div class="form-group" id="recipe-group">
                <label for="recipe-url">Recipe URL</label>
                <input type="url" id="recipe-url" name="recipeUrl" placeholder="https://...">
            </div>

            <div class="form-group">
                <label for="notes">Notes (optional)</label>
                <textarea id="notes" name="notes" placeholder="How was it? What would you change?"></textarea>
            </div>

            <button type="submit" class="btn btn-primary submit-btn">Add Entry</button>
        </form>
    </div>

    <script src="/food-tracker/db.js"></script>
    <script src="/food-tracker/app.js" type="module"></script>
</body>

</html>
