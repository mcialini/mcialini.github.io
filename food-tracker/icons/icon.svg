<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Food Tracker icon — orange background with fork+knife -->
  <rect width="512" height="512" rx="96" fill="#e8601a"/>

  <!-- Fork (left) -->
  <g fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <line x1="185" y1="120" x2="185" y2="250"/>
    <line x1="155" y1="120" x2="155" y2="200"/>
    <line x1="215" y1="120" x2="215" y2="200"/>
    <line x1="155" y1="200" x2="215" y2="200"/>
    <line x1="185" y1="250" x2="185" y2="400"/>
  </g>

  <!-- Knife (right) -->
  <g fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M327 120 C350 120 355 200 327 240"/>
    <line x1="327" y1="240" x2="327" y2="400"/>
  </g>
</svg>
